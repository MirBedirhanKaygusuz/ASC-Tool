question: >
  ARKit kullanılıyorsa deneyim zengin ve bütünleşik mi? Bir modeli AR
  görünümüne bırakmak ya da bir animasyonu oynatmak tek başına yeterli değil.
ruleText: >
  ARKit kullanan uygulamalar zengin ve bütünleşik artırılmış gerçeklik
  deneyimleri sunmalıdır; bir modeli AR görünümüne bırakmak veya animasyon
  oynatmak yeterli değildir.
