prefilter: [report crime, criminal activity, law enforcement, police, emergency report, suç ihbar, ihbar]
question: >
  Uygulama suç ihbarı almayı sağlıyorsa: yerel kolluk kuvvetleri sürece
  gerçekten dâhil mi ve uygulama yalnızca bu iş birliğinin aktif olduğu
  ülke/bölgelerde mi sunuluyor?
ruleText: >
  İddia edilen suç faaliyetini bildirmeye yarayan uygulamalar yerel kolluk
  kuvvetlerini sürece dâhil etmek zorundadır ve yalnızca bu katılımın aktif
  olduğu ülke veya bölgelerde sunulabilir.
outcome: manual
defaultSeverity: high
version: 1
