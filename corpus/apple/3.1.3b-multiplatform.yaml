id: apple-3.1.3b-multiplatform
platform: apple
source:
  doc: Apple App Review Guidelines
  section: "3.1.3(b)"
  url: https://developer.apple.com/app-store/review/guidelines/#3.1.3(b)
  retrievedAt: "2026-08-21"
tags: [payments, checklist]
scope: cross
needs: []
prefilter: ["web version", "desktop", "cross-platform", "multiplatform", "pc", "console", "also on the web"]
question: >
  Kullanıcı başka platformda (web, PC, konsol) edindiği içeriğe, aboneliğe ya
  da özelliğe uygulamada erişebiliyor mu? Erişebiliyorsa, aynı öğeler uygulama
  İÇİNDE de uygulama içi satın alma olarak sunuluyor mu? Çok platformlu
  oyunlardaki tüketilebilir öğeler de bu şarta tabi.
ruleText: >
  Birden fazla platformda çalışan uygulamalar, kullanıcıların başka
  platformlarda ya da web sitende edindikleri içeriğe, aboneliklere veya
  özelliklere — çok platformlu oyunlardaki tüketilebilir öğeler dâhil —
  erişmesine izin verebilir; yeter ki bu öğeler uygulama içinde de uygulama içi
  satın alma olarak sunuluyor olsun.
outcome: manual
defaultSeverity: medium
version: 1
