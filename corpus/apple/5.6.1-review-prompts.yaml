needs: []
question: >
  (1) Uygulama puanlama istemi için Apple'ın sağladığı API'yi mi kullanıyor?
  Özel/kendi yazdığın yorum istemleri kabul edilmiyor. (2) App Store
  yorumlarına verdiğin yanıtlar kullanıcının yorumuna odaklı mı; kişisel bilgi,
  spam ya da pazarlama içeriyor mu?
ruleText: >
  App Store müşteri yorumları uygulama deneyiminin ayrılmaz bir parçası
  olabilir; yorumlara yanıt verirken müşterilere saygılı davran. Yanıtların
  kullanıcının yorumuna odaklı olsun ve kişisel bilgi, spam ya da pazarlama
  içermesin. Kullanıcılardan uygulamanı değerlendirmelerini istemek için
  sağlanan API'yi kullan; özel yorum istemlerine izin verilmez.
outcome: manual
defaultSeverity: medium
version: 1
