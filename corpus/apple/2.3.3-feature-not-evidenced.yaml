id: apple-2.3.3-feature-not-evidenced
platform: apple
source:
  doc: Apple App Review Guidelines
  section: "2.3.3"
  url: https://developer.apple.com/app-store/review/guidelines/#accurate-metadata
  retrievedAt: "2026-08-19"
tags: [metadata, claims, screenshots]
# Red sebebi #4 (özellik bulunamıyor) + #22 (olmayan özellik vaadi).
# Aynı mekanizma: metin bir şey vaat ediyor, hiçbir kanıt yok.
scope: cross
needs: [description, subtitle, promotionalText, screenshots]
facts:
  - "Uygulamanın KENDİ ADI, alt başlığı, kategorisi ve uygulama içi ürünleri o özellik için KANITTIR. 'AI Video, Face Swap: Editor' adlı bir uygulamada yüz değiştirme kanıtlanmıştır; ayrıca ekran görüntüsünde göstermesi gerekmez."
  - "Ekran görüntülerinin uygulama arayüzünü göstermemesi AYRI bir sorundur ve AYRI bir kart onu denetliyor (apple-2.3.3-screenshots-reflect-app). Bu kart o konuya girmez."
  - "Bu kartın hedefi, uygulamanın gerçekten yapamayacağı bir işi vaat etmesidir — bir fotoğraf filtresi uygulamasının 'dermatologla canlı görüşme' vaat etmesi gibi."
question: >
  Açıklama veya alt başlık, uygulamanın YAPAMAYACAĞI somut bir iş vaat ediyor
  mu? Yani vaat, uygulamanın adı, alt başlığı, kategorisi ve uygulama içi
  ürünleriyle BAĞDAŞMIYOR mu?

  BULGU ÜRETME şu durumlarda:
  - Vaat, uygulamanın adı/alt başlığı/kategorisiyle uyumluysa (bir yüz
    değiştirme uygulamasının yüz değiştirme vaat etmesi gibi).
  - Yalnızca "ekran görüntülerinde göremiyorum" diyeceksen. Görsellerin
    arayüzü göstermemesi BAŞKA bir kartın konusu; burada bulgu değildir.
  - Genel pazarlama ifadeleri için ("kolay kullanım", "hızlı", "en iyi").

  BULGU ÜRET yalnızca: vaat edilen iş uygulamanın tarif ettiği işle
  çelişiyorsa ya da o kategoride teknik olarak mümkün görünmüyorsa.
  Emin değilsen bulgu üretme.
ruleText: >
  Metadata'da tanıtılan özellikler uygulamada gerçekten bulunmalıdır.
  Reviewer tanıtılan bir özelliği bulamazsa gönderim reddedilir.
positiveExample: "Bir fotoğraf filtresi uygulamasının açıklamasında: 'Includes live 24/7 video consultation with certified dermatologists.'"
negativeExample: "'AI Video, Face Swap: Editor' adlı uygulamanın açıklamasında 'Put your face into any scene' — ad ve kategoriyle bağdaşıyor, bulgu değil."
outcome: risk
defaultSeverity: medium
version: 2
