question: >
  Finansal işlem, yatırım ya da para yönetimi hizmeti sunan uygulama, bu
  hizmeti VEREN finansal kurum tarafından mı gönderiliyor? Uygulamanın sunulduğu
  tüm ülkelerde gerekli lisans ve izinler var mı? (5.1.1(ix) ayrıca bu tür
  düzenlemeye tabi hizmetlerin bireysel geliştirici hesabıyla gönderilmemesini
  istiyor.)
ruleText: >
  Finansal işlem, yatırım veya para yönetimi için kullanılan uygulamalar, bu
  hizmetleri veren finansal kurum tarafından gönderilmeli ve uygulamayı sunduğun
  yerlerde gerekli lisans ve izinlere sahip olmalıdır.
outcome: manual
