question: >
  Bir amaç için toplanan veri, yeni bir rıza alınmadan başka bir amaçla
  kullanılıyor mu? (Ör. ürün teslimi için alınan adresin reklam hedeflemede
  kullanılması.)
ruleText: >
  Bir amaç için toplanan veri, yasa açıkça izin vermedikçe, ek rıza olmadan
  başka bir amaçla yeniden kullanılamaz.
