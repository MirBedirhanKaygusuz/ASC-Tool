question: >
  Uygulama, kişisel bilgiyi doğrudan kullanıcıdan almadan ya da açık rızası
  olmadan derliyor mu? Kamuya açık veritabanları da buna dâhil — "insan arama",
  telefon rehberi, kayıt taraması gibi işlevler bu maddeden reddediliyor.
ruleText: >
  Doğrudan kullanıcıdan olmayan hiçbir kaynaktan, kullanıcının açık rızası
  olmadan kişisel bilgi derleyen uygulamalara — kamuya açık veritabanları dâhil —
  App Store'da veya alternatif dağıtımda izin verilmez.
