question: >
  Uygulama hakkında aşırı müşteri şikâyeti, olumsuz yorum ya da aşırı iade
  talebi var mı? Apple bunları kalite beklentisinin karşılanmadığının göstergesi
  sayıyor ve Developer Code of Conduct değerlendirmesinde kullanıyor.
ruleText: >
  Müşteriler App Store'dan en yüksek kaliteyi bekler. Uygulaman hakkında aşırı
  müşteri şikâyeti — olumsuz müşteri yorumları gibi — ve aşırı iade talepleri bu
  beklentinin karşılanmadığının göstergeleridir. Yüksek kaliteyi
  sürdürememek, geliştiricinin Developer Code of Conduct'a uyup uymadığına karar
  verirken bir etken olabilir.
outcome: manual
