question: >
  iPhone uygulaması iPad'de de çalışıyor mu? Apple bunu "mümkün olduğunda"
  bekliyor. Çalışmıyorsa sebebi (ör. yalnızca iPhone'da olan bir donanım)
  savunulabilir mi ve ekran görüntüsü/cihaz aileleri buna uygun mu?
