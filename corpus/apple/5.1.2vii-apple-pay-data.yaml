question: >
  Apple Pay ile elde edilen kullanıcı verisi üçüncü taraflarla yalnızca mal ve
  hizmetlerin teslimini kolaylaştırmak ya da iyileştirmek için mi paylaşılıyor?
ruleText: >
  Apple Pay kullanan uygulamalar, Apple Pay aracılığıyla elde edilen kullanıcı
  verisini üçüncü taraflarla yalnızca mal ve hizmetlerin tesliminin
  kolaylaştırılması ya da iyileştirilmesi amacıyla paylaşabilir.
