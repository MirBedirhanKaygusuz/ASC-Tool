prefilter: [pre-order, preorder, coming soon, launching soon, ön sipariş]
question: >
  Ön siparişe açtığın uygulama, gönderdiğin hâliyle eksiksiz ve teslim
  edilebilir mi? Yayınlanan sürüm, ön sipariş sırasında tanıtılandan esaslı
  biçimde farklı olacak mı (özellikle iş modeli değişikliği)? Esaslı değişiklik
  varsa ön sipariş satışını yeniden başlatman gerekir.
ruleText: >
  Ön sipariş için gönderilen uygulamalar gönderildiği hâliyle eksiksiz ve
  teslim edilebilir olmalıdır. Yayımladığın uygulama, ön sipariş sırasında
  tanıttığından esaslı biçimde farklı olmamalıdır; esaslı değişiklik (ör. iş
  modeli değişikliği) yaparsan ön sipariş satışını yeniden başlatmalısın.
outcome: manual
defaultSeverity: medium
version: 1
