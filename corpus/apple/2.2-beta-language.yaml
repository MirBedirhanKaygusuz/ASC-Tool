id: apple-2.2-beta-language
platform: apple
source:
  doc: Apple App Review Guidelines
  section: "2.2"
  url: https://developer.apple.com/app-store/review/guidelines/#2.2
  retrievedAt: "2026-08-21"
tags: [metadata, completeness]
scope: single
needs: [name, subtitle, description, promotionalText, whatsNew, keywords]
prefilter: [beta, alpha, demo version, trial version, preview version, early access, prototype, test version, work in progress, "wip"]
facts:
  - "Apple’ın kuralı sürümün KENDİSİ hakkında: demo, beta ve deneme sürümleri App Store’a değil TestFlight’a ait."
  - "“Free trial” bir abonelik teklifidir ve bu maddenin konusu değildir — karıştırma."
question: >
  Metin, bu sürümün kendisinin bir beta, demo, önizleme ya da deneme sürümü
  olduğunu söylüyor mu? Böyle bir ifade varsa bildir. Abonelikteki ücretsiz
  deneme ("free trial") ya da "erken erişim içerik paketi" gibi ürün adları
  bu maddenin konusu değildir.
ruleText: >
  Uygulamanın demo, beta ve deneme sürümleri App Store'a ait değildir; bunun
  için TestFlight kullanılmalıdır.
positiveExample: "This is an early beta — expect bugs while we test new features."
negativeExample: "Try Premium free for 7 days, then $4.99/month."
outcome: violation
defaultSeverity: high
version: 1
