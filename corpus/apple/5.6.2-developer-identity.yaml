question: >
  App Store'da görünen kimlik bilgileri doğru mu: satıcı adı, geliştirici adı,
  iletişim bilgisi ve uygulamanın sunduğu şeye dair beyanlar? Bilgiler güncel mi
  ve Apple ile müşteriler kiminle muhatap olduklarını anlayabiliyor mu?
ruleText: >
  Apple'a ve müşterilere doğrulanabilir bilgi sunmak müşteri güveni için
  kritiktir. Kendini, işletmeni ve sunduklarını App Store'da ya da alternatif
  dağıtımda doğru temsil etmelisin. Verdiğin bilgi doğru, ilgili ve güncel
  olmalıdır; böylece Apple ve müşteriler kiminle muhatap olduklarını anlar ve
  sorun hâlinde sana ulaşabilir.
outcome: manual
