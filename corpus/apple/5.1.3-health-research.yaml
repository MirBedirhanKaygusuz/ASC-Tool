question: >
  Sağlık/fitness/tıbbi veri işleyen uygulamada: (i) bu veri reklam, pazarlama
  ya da kullanım tabanlı veri madenciliği için kullanılıyor mu (yasak; sağlık
  yönetimini iyileştirmek ya da izinli sağlık araştırması istisna); topladığın
  spesifik sağlık verisini açıkladın mı, (ii) HealthKit'e ya da başka bir sağlık
  uygulamasına yanlış veri yazılıyor mu; kişisel sağlık bilgisi iCloud'da mı
  tutuluyor (tutulmamalı), (iii) insan araştırması yapılıyorsa katılımcıdan
  (küçüklerde ebeveyn/vasiden) araştırmanın niteliği, amacı ve süresi;
  prosedürler, riskler ve faydalar; gizlilik ve veri paylaşımı; soru için
  iletişim noktası; çekilme süreci anlatılarak rıza alınıyor mu, (iv) bağımsız
  bir etik kurul onayı alındı mı?
ruleText: >
  Sağlık, fitness ve tıbbi araştırma bağlamında toplanan veri — Clinical
  Health Records API, HealthKit, Motion and Fitness, MovementDisorder API'leri ya
  da sağlıkla ilgili insan araştırmaları dâhil — sağlık yönetimini iyileştirmek
  ya da izinli sağlık araştırması dışında reklam, pazarlama veya kullanım
  tabanlı veri madenciliği için kullanılamaz ve üçüncü taraflara açıklanamaz.
  Cihazdan topladığın spesifik sağlık verisini açıklamalısın. Uygulamalar
  HealthKit'e ya da başka bir tıbbi araştırma/sağlık yönetimi uygulamasına yanlış
  veya hatalı veri yazamaz ve kişisel sağlık bilgisini iCloud'da saklayamaz.
  Sağlıkla ilgili insan araştırması yapan uygulamalar katılımcılardan (küçüklerde
  ebeveyn veya vasiden) rıza almalı ve bağımsız bir etik inceleme kurulundan
  onay sağlamalıdır.
outcome: manual
defaultSeverity: high
version: 1
