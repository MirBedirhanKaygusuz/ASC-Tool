question: >
  Uygulama iki kişi arasında GERÇEK ZAMANLI birebir hizmet satışı sağlıyorsa
  (özel ders, tıbbi danışma, emlak turu, kişisel antrenman) uygulama içi satın
  alma dışında ödeme alabilirsin. Ancak bire-birkaç ya da bire-çok gerçek zamanlı
  hizmetler (grup dersi, webinar) uygulama içi satın alma kullanmak zorunda —
  uygulamadaki hizmet hangisi?
ruleText: >
  Uygulaman iki birey arasında gerçek zamanlı, kişiden kişiye hizmet satın
  alınmasını sağlıyorsa (öğrenciye özel ders, tıbbi danışma, emlak turu, kişisel
  antrenman) bu ödemeleri toplamak için uygulama içi satın alma dışındaki ödeme
  yöntemlerini kullanabilirsin. Bire-birkaç ve bire-çok gerçek zamanlı hizmetler
  uygulama içi satın alma kullanmalıdır.
outcome: manual
defaultSeverity: high
version: 1
