  retrievedAt: "2026-08-21"
tags: [software, checklist]
scope: cross
needs: []
question: >
  Uygulama yalnızca genel (public) API'leri mi kullanıyor ve güncel işletim
  sisteminde mi çalışıyor? Kullanımdan kaldırılan çerçeveler ayıklandı mı?
  Kullanılan çerçeveler AMACINA uygun mu (HealthKit sağlık/fitness için,
  HomeKit ev otomasyonu için) ve bu entegrasyon uygulama açıklamasında
  belirtiliyor mu?
ruleText: >
  Uygulamalar yalnızca genel API'leri kullanabilir ve güncel işletim
  sisteminde çalışmalıdır. Kullanımdan kaldırılan özellik, çerçeve ve
  teknolojiler aşamalı olarak bırakılmalıdır. API ve çerçeveler amaçlarına
  uygun kullanılmalı ve bu entegrasyon uygulama açıklamasında belirtilmelidir.
outcome: manual
defaultSeverity: high
version: 1
