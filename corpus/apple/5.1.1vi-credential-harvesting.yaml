question: >
  Uygulama, kullanıcının şifrelerini ya da özel verilerini gizlice ele
  geçiren bir davranış içeriyor mu? Şifre yöneticisi ya da kasa uygulamalarında
  verinin nerede saklandığı ve kimin eriştiği açıkça anlatılıyor mu?
ruleText: >
  Uygulamalarını şifreleri ya da diğer özel verileri gizlice ele geçirmek için
  kullanan geliştiriciler Apple Developer Program'dan çıkarılır.
