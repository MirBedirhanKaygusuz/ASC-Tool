needs: []
appliesWhen:
  hasAppExtensions: true
question: >
  Widget'lar, uzantılar ve bildirimler uygulamanın içeriği ve işleviyle
  ilgili mi? App Clip kullanıyorsan: tüm App Clip özellikleri ana uygulama
  binary'sinde de var mı ve App Clip reklam içermiyor mu?
ruleText: >
  Widget'lar, uzantılar ve bildirimler uygulamanın içeriği ve işleviyle
  ilgili olmalıdır. Ayrıca tüm App Clip özellikleri ve işlevleri ana uygulama
  binary'sinde yer almalıdır; App Clip'ler reklam içeremez.
outcome: manual
defaultSeverity: medium
version: 1
