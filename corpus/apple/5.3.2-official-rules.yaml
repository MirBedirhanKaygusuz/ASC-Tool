question: >
  Çekiliş, yarışma ya da piyangonun resmî kuralları uygulamanın İÇİNDE
  sunuluyor mu? Bu kurallar Apple'ın sponsor OLMADIĞINI ve etkinliğe hiçbir
  biçimde dâhil olmadığını açıkça belirtiyor mu?
ruleText: >
  Çekilişlerin, yarışmaların ve piyangoların resmî kuralları uygulamada
  sunulmalı ve Apple'ın sponsor olmadığını, etkinliğe hiçbir biçimde dâhil
  olmadığını açıkça belirtmelidir.
