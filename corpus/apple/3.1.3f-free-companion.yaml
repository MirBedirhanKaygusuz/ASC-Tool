needs: []
prefilter: ["companion", "cloud storage", "voip", "hosting", "web app", "existing account"]
question: >
  Uygulama, ücretli bir web tabanlı aracın (VoIP, bulut depolama, e-posta,
  web hosting) ücretsiz yardımcı uygulaması mı? Öyleyse uygulamanın İÇİNDE
  hiçbir satın alma ve dışarıda satın almaya yönelik hiçbir çağrı bulunmamalı —
  var mı?
ruleText: >
  Ücretli, web tabanlı bir aracın (VoIP, bulut depolama, e-posta hizmetleri,
  web hosting) bağımsız yardımcısı olan ücretsiz uygulamalar, uygulama içinde
  hiçbir satın alma ve uygulama dışında satın almaya yönelik hiçbir çağrı
  bulunmaması koşuluyla uygulama içi satın alma kullanmak zorunda değildir.
outcome: manual
defaultSeverity: medium
version: 1
