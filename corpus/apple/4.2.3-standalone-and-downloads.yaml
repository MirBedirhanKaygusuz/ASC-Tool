question: >
  (i) Uygulama başka bir uygulamanın kurulmasını gerektirmeden kendi başına
  çalışıyor mu? (ii) İlk açılışta çalışabilmek için ek kaynak indirmesi
  gerekiyorsa, indirmenin boyutu kullanıcıya söyleniyor ve onayı alınıyor mu?
ruleText: >
  Uygulaman başka bir uygulamanın kurulmasını gerektirmeden kendi başına
  çalışmalıdır. İlk açılışta çalışmak için ek kaynak indirmesi gerekiyorsa,
  indirmenin boyutunu açıkla ve indirmeden önce kullanıcıya sor.
