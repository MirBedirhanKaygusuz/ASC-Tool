question: >
  Uygulama üçüncü taraf bir servisin içeriğini kullanıyor, ona erişiyor,
  erişimi paraya çeviriyor ya da içeriğini gösteriyorsa: o servisin kullanım
  şartları buna AÇIKÇA izin veriyor mu? Apple istediğinde yetkiyi belgeleyebilir
  misin?
ruleText: >
  Uygulaman üçüncü taraf bir servisin içeriğini kullanıyor, ona erişiyor,
  erişimini paraya çeviriyor ya da içeriğini gösteriyorsa, bunu yapmana o
  servisin kullanım şartları uyarınca özel olarak izin verildiğinden emin ol.
  Yetki, talep edildiğinde sunulmalıdır.
outcome: manual
defaultSeverity: high
version: 1
