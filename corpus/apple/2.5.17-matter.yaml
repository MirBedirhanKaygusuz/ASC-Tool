question: >
  Matter destekliyorsan: eşleştirmeyi başlatmak için Apple'ın Matter destek
  çerçevesini kullanıyor musun? Apple'ın verdiği Matter SDK dışında bir Matter
  bileşeni kullanıyorsan, o bileşen çalıştığı platform için Connectivity
  Standards Alliance tarafından sertifikalandırılmış mı?
ruleText: >
  Matter destekleyen uygulamalar eşleştirmeyi başlatmak için Apple'ın Matter
  destek çerçevesini kullanmalıdır. Apple'ın sağladığı Matter SDK dışında bir
  Matter yazılım bileşeni kullanılıyorsa, bu bileşen çalıştığı platform için
  Connectivity Standards Alliance tarafından sertifikalandırılmış olmalıdır.
outcome: manual
