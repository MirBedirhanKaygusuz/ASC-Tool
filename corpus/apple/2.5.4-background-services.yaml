needs: []
prefilter: ["background", "voip", "location", "audio", "always on", "arka plan"]
question: >
  Uygulama arka plan servislerini yalnızca amacına uygun kullanıyor mu
  (VoIP, ses çalma, konum, görev tamamlama, yerel bildirim)? Beyan edilen arka
  plan modu gerçekten kullanılıyor mu, yoksa yalnızca uygulamayı canlı tutmak
  için mi açılmış?
ruleText: >
  Çoklu görev yapan uygulamalar arka plan servislerini yalnızca amaçlarına
  uygun kullanabilir: VoIP, ses çalma, konum, görev tamamlama, yerel
  bildirimler vb.
