prefilter: ["restart", "reboot", "turn off wi-fi", "airplane mode", "disable", "settings"]
question: >
  Uygulama, kullanıcıdan cihazı yeniden başlatmasını ya da uygulamanın ana
  işleviyle ilgisiz sistem ayarlarını değiştirmesini istiyor mu (Wi-Fi'ı
  kapat, güvenlik özelliğini devre dışı bırak gibi)?
ruleText: >
  Uygulamalar, ana işlevleriyle ilgisiz biçimde cihazın yeniden
  başlatılmasını ya da sistem ayarlarının değiştirilmesini asla önermemeli ve
  şart koşmamalıdır.
outcome: manual
