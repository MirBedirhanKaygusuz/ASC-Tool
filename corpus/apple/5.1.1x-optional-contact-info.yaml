tags: [privacy, checklist]
scope: cross
needs: []
appliesWhen:
  allowsAccountCreation: true
question: >
  Uygulama ad ve e-posta gibi temel iletişim bilgisi istiyorsa: (1) bu istek
  kullanıcı için İSTEĞE BAĞLI mı, (2) özellik ve hizmetler bu bilgiyi vermeye
  bağlı mı (olmamalı), (3) çocuklardan bilgi toplama sınırları dâhil diğer
  kurallara uyuluyor mu?
ruleText: >
  Uygulamalar temel iletişim bilgisi (ad ve e-posta adresi gibi) isteyebilir;
  yeter ki bu istek kullanıcı için isteğe bağlı olsun, özellik ve hizmetler bu
  bilginin verilmesine bağlı olmasın ve çocuklardan bilgi toplamaya ilişkin
  sınırlamalar dâhil bu kuralların diğer hükümlerine uyulsun.
outcome: manual
defaultSeverity: medium
version: 1
