id: apple-5.1.2vi-sensitive-api-data
platform: apple
source:
  doc: Apple App Review Guidelines
  section: "5.1.2"
  url: https://developer.apple.com/app-store/review/guidelines/#5.1.2
  retrievedAt: "2026-08-21"
tags: [privacy, health, checklist]
scope: cross
needs: []
appliesWhen:
  hasHealthFeatures: true
question: >
  HomeKit, HealthKit, Clinical Health Records, MovementDisorder, ClassKit ya
  da derinlik/yüz haritalama araçlarından (ARKit, kamera, fotoğraf API'leri)
  toplanan veri pazarlama, reklam ya da kullanım tabanlı veri madenciliği için
  kullanılıyor mu? Üçüncü taraflar aracılığıyla da olsa bu yasak.
ruleText: >
  HomeKit API, HealthKit, Clinical Health Records API, MovementDisorder
  API'leri, ClassKit ya da derinlik ve/veya yüz haritalama araçlarından (ARKit,
  kamera API'leri, fotoğraf API'leri) toplanan veri, üçüncü taraflar dâhil,
  pazarlama, reklam ya da kullanım tabanlı veri madenciliği için kullanılamaz.
outcome: manual
defaultSeverity: high
version: 1
