  retrievedAt: "2026-08-21"
tags: [subscriptions, checklist]
scope: cross
needs: []
appliesWhen:
  hasSubscription: true
question: >
  Kullanıcı abonelik yükseltme ve düşürme işlemini sorunsuz yapabiliyor mu?
  Aynı şeyin farklı varyasyonlarına yanlışlıkla aynı anda abone olmak mümkün mü
  (ör. hem aylık hem yıllık plana birden)?
ruleText: >
  Kullanıcılar sorunsuz bir yükseltme/düşürme deneyimi yaşamalı ve aynı şeyin
  birden fazla varyasyonuna yanlışlıkla abone olamamalıdır.
outcome: manual
