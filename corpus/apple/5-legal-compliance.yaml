question: >
  Uygulamanın sunulduğu HER ülkede geçerli yasalara uyduğu kontrol edildi mi?
  Apple bunu geliştiricinin sorumluluğuna bırakıyor: yalnız bu kurallara uymak
  yetmiyor. Suç ya da açıkça pervasız davranışı teşvik eden hiçbir işlev yok,
  değil mi?
ruleText: >
  Uygulamalar, sunuldukları her yerde tüm yasal gerekliliklere uymalıdır.
  Yerel yasaları anlamak ve uygulamanın bunlara uygun olmasını sağlamak senin
  sorumluluğundur. Suç işlemeyi ya da açıkça pervasız davranışı talep eden,
  teşvik eden veya özendiren uygulamalar reddedilir.
outcome: manual
defaultSeverity: medium
version: 1
