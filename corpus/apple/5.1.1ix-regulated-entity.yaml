  retrievedAt: "2026-08-21"
tags: [privacy, legal, checklist]
scope: cross
needs: []
prefilter: ["bank", "banking", "loan", "health", "medical", "gambling", "betting", "casino", "cannabis", "crypto", "exchange", "insurance", "airline", "flight"]
question: >
  Uygulama sıkı düzenlemeye tabi bir alanda mı hizmet veriyor (bankacılık ve
  finans, sağlık, kumar, yasal esrar, hava yolu, kripto borsası) ya da hassas
  kullanıcı bilgisi mi istiyor? Öyleyse gönderim, hizmeti VEREN tüzel kişilik
  tarafından mı yapılıyor (bireysel geliştirici hesabı değil)? Yasal esrar
  satışını kolaylaştırıyorsan uygulama ilgili yasal yargı alanıyla coğrafi
  olarak sınırlandırıldı mı?
ruleText: >
  Sıkı düzenlemeye tabi alanlarda (bankacılık ve finansal hizmetler, sağlık,
  kumar, yasal esrar kullanımı, hava yolculuğu ve kripto borsaları gibi) hizmet
  veren ya da hassas kullanıcı bilgisi gerektiren uygulamalar, bireysel bir
  geliştirici tarafından değil, bu hizmetleri sağlayan tüzel kişilik tarafından
  gönderilmelidir. Yasal esrar satışını kolaylaştıran uygulamalar ilgili yasal
  yargı alanıyla coğrafi olarak sınırlandırılmalıdır.
outcome: manual
defaultSeverity: high
version: 1
