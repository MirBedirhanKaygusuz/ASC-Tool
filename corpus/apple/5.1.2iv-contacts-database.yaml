id: apple-5.1.2iv-contacts-database
platform: apple
source:
  doc: Apple App Review Guidelines
  section: "5.1.2"
  url: https://developer.apple.com/app-store/review/guidelines/#5.1.2
  retrievedAt: "2026-08-21"
tags: [privacy, checklist]
scope: cross
needs: []
prefilter: ["contacts", "address book", "phonebook", "invite friends", "find friends", "sync contacts"]
question: >
  Kişiler, Fotoğraflar ya da benzer API'lerden alınan bilgiyle kendi kullanımın
  için veya üçüncü taraflara satmak/dağıtmak üzere bir iletişim veritabanı
  oluşturuluyor mu? Cihazda başka hangi uygulamaların kurulu olduğu analitik ya
  da reklam/pazarlama amacıyla toplanıyor mu?
ruleText: >
  Kişiler, Fotoğraflar ya da kullanıcı verisine erişen diğer API'lerden gelen
  bilgiyi kendi kullanımın için veya üçüncü taraflara satmak/dağıtmak üzere bir
  iletişim veritabanı oluşturmak amacıyla kullanma; kullanıcının cihazında hangi
  uygulamaların kurulu olduğunu analitik ya da reklam/pazarlama amacıyla toplama.
outcome: manual
defaultSeverity: high
version: 1
