prefilter: ["only available in", "carrier", "operator", "region locked", "only for users in"]
question: >
  Uygulamayı kimin kullanabileceği keyfî olarak kısıtlanıyor mu (konuma ya da
  operatöre göre)? Yasal zorunluluk ya da lisans kaynaklı coğrafi kısıt bu
  maddenin konusu değildir — 5.3.4 ve 5.1.1(ix) bazı durumlarda coğrafi kısıt
  ZORUNLU kılıyor.
ruleText: >
  Uygulamayı kimin kullanabileceğinin keyfî biçimde kısıtlanması — ör. konuma
  ya da operatöre göre — kabul edilemez.
