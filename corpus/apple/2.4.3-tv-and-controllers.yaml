question: >
  Apple TV uygulaması Siri Remote ya da üçüncü taraf oyun kumandası dışında
  bir donanım gerektirmeden kullanılabiliyor mu? Oyun kumandası ZORUNLU ise
  bu, kullanıcı satın almadan önce metadata'da açıkça yazıyor mu?
ruleText: >
  İnsanlar Apple TV uygulamanı Siri Remote ya da üçüncü taraf oyun
  kumandaları dışında bir donanım girişine ihtiyaç duymadan kullanabilmelidir.
  Oyun kumandası şart koşuyorsan bunu metadata'da açıkça anlat.
