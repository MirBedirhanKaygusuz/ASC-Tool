question: >
  Uygulama hesap oluşturmaya izin veriyorsa, uygulama İÇİNDEN hesabı kalıcı silme yolu var mı? Yalnızca e-posta ile talep etmek yetmez; akış uygulama içinde bulunabilir olmalı.
