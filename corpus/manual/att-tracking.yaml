id: apple-5.1.2-att
platform: apple
source:
  doc: Apple App Review Guidelines
  section: "5.1.2"
  url: https://developer.apple.com/app-store/review/guidelines/#data-use-and-sharing
  retrievedAt: "2026-08-19"
tags: [checklist, privacy]
scope: single
needs: []

# Bu kart eskiden HER uygulamada elle kontrol listesine düşüyordu; herkese
# gösterilen bir madde hiçbir bilgi taşımıyor. Artık yalnız App Privacy
# etiketinde takip beyanı olanlarda çıkıyor. Etiket ÇEKİLMEMİŞSE kart
# sessizce elenmez — "bilgi eksik" kovasına düşer ve raporda görünür.
appliesWhen:
  declaresTracking: true
question: >
  Uygulama reklam/analitik için cihazlar arası takip yapıyorsa AppTrackingTransparency izni isteniyor mu? İzin verilmediğinde takip gerçekten duruyor mu? App Privacy etiketindeki beyanla tutarlı mı?
ruleText: >
  Kullaniciyi diger uygulama/sitelerde takip eden uygulamalar AppTrackingTransparency izni istemek zorundadir.
outcome: manual
defaultSeverity: high
version: 1
